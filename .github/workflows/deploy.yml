name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages は同一リポジトリの gh-pages ブランチへ成果物を push する。
    # この job でのみ必要なため、GITHUB_TOKEN の contents 書込み権限をここへ限定する。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: |
          cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml
          pnpm install --frozen-lockfile
          pnpm run build:dictionary

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Package build
        run: pnpm run build

      - name: Pages build
        run: pnpm run deploy

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
