allowBuilds:
  esbuild: true
  fsevents: false

# m1-t7 D-5: outer の overrides のうち当 repo に必要な部分集合のみを配る
# （正本は scripts/m1-t3/overrides.json。全量コピーは verify:m1-t3:overrides を FAIL させる）
overrides:
  minimatch: "^9.0.7"
  # undici: <8.12.2 の high（GHSA-4w7w-5xrc-9h26 ほか）。8 系のまま上げる
  undici: "^8.12.2"
  # eslint の系が引く minimatch: <11.0.1 の medium（GHSA-g3hv-75wg-m249）。修正版は 11 系だけ。
  # glob 10・11 は minimatch 11 と組めないので、全体ではなく eslint の系の親に限って上げる
  "eslint>minimatch": "^11.0.1"
  "@eslint/config-array>minimatch": "^11.0.1"
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
