<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>F-CLEAN</title>
  <!-- nov26-m3-t1 §3.2: ページ側 CSS は最小。縦に長くしてスクロールの試験に使う -->
  <style>body{margin:0;height:3000px}</style>
</head>
<body>
  <input id="f1" type="text" style="position:absolute!important; left:40px!important; width:320px!important; margin:0!important; box-sizing:border-box!important; padding:4px 8px!important; border:1px solid #888!important; font:16px/22px monospace!important; letter-spacing:0!important; text-align:left!important; direction:ltr!important; color:#000!important; background:#fff!important; display:inline-block!important; top:120px!important; height:32px!important;">
  <textarea id="f2" style="position:absolute!important; left:40px!important; width:320px!important; margin:0!important; box-sizing:border-box!important; padding:4px 8px!important; border:1px solid #888!important; font:16px/22px monospace!important; letter-spacing:0!important; text-align:left!important; direction:ltr!important; color:#000!important; background:#fff!important; display:inline-block!important; top:200px!important; height:96px!important;"></textarea>
  <script type="module">
    // origin/master の NagaIME は公開 API に無い ∴ デモ（src/naga-demo.ts）と同じくソースを直に読む
    import { NagaIME } from '/src/lib/ime/naga-ime.ts';
    const ime = new NagaIME({ loadFonts: false });
    ime.attach([document.getElementById('f1'), document.getElementById('f2')]);
    window.__naga = ime;
  </script>
</body>
</html>
